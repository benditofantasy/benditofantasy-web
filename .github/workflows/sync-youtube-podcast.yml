name: Sync latest podcast episode

# Daily check for a new podcast episode on the current season's YouTube
# playlist, plus any one-off tournament playlists (e.g. a World Cup) listed
# under "specials" in content/youtube-sync-config.json. Steady-state case
# only (see scripts/sync-latest-podcast.mjs) — the one-time historical
# backfill was a separate, hand-reviewed pass.
on:
  schedule:
    - cron: "0 13 * * *" # once a day
  workflow_dispatch: {} # manual trigger from the Actions tab, for testing

permissions:
  contents: write
  pull-requests: write
  issues: write # so a failed run can open/close the "sync failing" alert issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yt-dlp
        run: pip install --user yt-dlp

      - name: Install deno (JS runtime yt-dlp uses for signature/n-param solving)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Run sync script
        env:
          # Ordered list of yt-dlp player clients to try before giving up (see
          # scripts/sync-latest-podcast.mjs). Set it here to change which
          # clients are used when YouTube's bot wall shifts, without a code
          # change. Empty = the script's own default list.
          YT_DLP_PLAYER_CLIENTS: ""
        run: node scripts/sync-latest-podcast.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^??' ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the new episode
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="content/podcast-sync-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git config user.name "bendito-bot"
          git config user.email "actions@github.com"
          git add content/gameweeks content/specials public/media
          git commit -m "Sync latest podcast episode"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Sync latest podcast episode" \
            --body "Automated: new episode found on a synced YouTube playlist. Review the content file + thumbnail, then merge to publish." \
            --base main \
            --head "$BRANCH"

      # Same nudge the social sync has: a red run in the Actions tab is easy to
      # miss, and this sync only runs once a day, so a silent failure can sit
      # for a week. The issue is the thing that actually reaches a human.
      - name: Open/update alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Podcast sync failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            const body = `The daily podcast sync run failed.\n\nFailed run: ${runUrl}\n\nCheck the logs — common causes: yt-dlp hit YouTube's "Sign in to confirm you're not a bot" wall on every player client (try a different order via \`YT_DLP_PLAYER_CLIENTS\` in the workflow, and check the [yt-dlp extractors wiki](https://github.com/yt-dlp/yt-dlp/wiki/Extractors)), a playlist URL that no longer resolves, or a \`preseason\`/\`specials\` route in \`content/youtube-sync-config.json\` pointing at a file that doesn't exist. This issue auto-closes on the next successful run.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close alert issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Podcast sync failing";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Sync succeeded again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
