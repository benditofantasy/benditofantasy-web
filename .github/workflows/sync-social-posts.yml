name: Sync latest social posts

# Daily check for new @benditofantasy posts (see scripts/sync-social-posts.mjs).
# Bluesky is the live source and needs no secret — just `blueskyHandle` in
# content/social-sync-config.json. Threads/Instagram stay dormant until their
# THREADS_ACCESS_TOKEN / IG_ACCESS_TOKEN repo secrets and matching user ids are
# set. A watermark in content/social-sync-state.json (committed) makes the first
# run import nothing and each later run pick up only genuinely new posts.
on:
  schedule:
    - cron: "0 13 * * *" # once a day
  workflow_dispatch: {} # manual trigger from the Actions tab, for testing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/sync-social-posts.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^??' ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new post(s) straight to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          # No PR (owner decision): a post on Bluesky should appear on the site
          # without a manual re-post/merge round-trip. The sync only ever adds
          # already-published social posts + advances the watermark, so pushing
          # to main directly is safe and self-limiting.
          git config user.name "bendito-bot"
          git config user.email "actions@github.com"
          git add content/gameweeks content/social-sync-state.json public/media
          git commit -m "Sync latest social posts"
          git push origin HEAD:main
