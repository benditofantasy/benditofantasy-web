name: Sync latest Threads/Instagram posts

# Daily check for new @benditofantasy posts on Threads/Instagram (see
# scripts/sync-social-posts.mjs). No-ops cleanly per-platform until
# THREADS_ACCESS_TOKEN / IG_ACCESS_TOKEN repo secrets and the matching user
# ids in content/social-sync-config.json are set up.
on:
  schedule:
    - cron: "0 13 * * *" # once a day
  workflow_dispatch: {} # manual trigger from the Actions tab, for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/sync-social-posts.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^??' ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the new post(s)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="content/social-sync-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git config user.name "bendito-bot"
          git config user.email "actions@github.com"
          git add content/gameweeks public/media
          git commit -m "Sync latest Threads/Instagram posts"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Sync latest Threads/Instagram posts" \
            --body "Automated: new post(s) found for @benditofantasy. The tile cover is left unset for a human to fill in (there's no open thumbnail endpoint like YouTube's) — the lightbox itself renders the real embed regardless. Review, then merge to publish." \
            --base main \
            --head "$BRANCH"
