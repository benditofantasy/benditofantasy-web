name: Sync latest social posts

# Hourly check for new @benditofantasy posts (see scripts/sync-social-posts.mjs).
# Bluesky is the live source and needs no secret — just `blueskyHandle` in
# content/social-sync-config.json. Threads/Instagram stay dormant until their
# THREADS_ACCESS_TOKEN / IG_ACCESS_TOKEN repo secrets and matching user ids are
# set. A watermark in content/social-sync-state.json (committed) makes the first
# run import nothing and each later run pick up only genuinely new posts.
on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC)
  workflow_dispatch: {} # manual trigger from the Actions tab, for testing

permissions:
  contents: write
  issues: write # so a failed run can open/close the "sync failing" alert issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/sync-social-posts.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^??' ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new post(s) straight to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          # No PR (owner decision): a post on Bluesky should appear on the site
          # without a manual re-post/merge round-trip. The sync only ever adds
          # already-published social posts + advances the watermark, so pushing
          # to main directly is safe and self-limiting.
          git config user.name "bendito-bot"
          git config user.email "actions@github.com"
          git add content/gameweeks content/specials content/social-sync-state.json public/media
          git commit -m "Sync latest social posts"
          # Rebase onto the latest main first so a human push landing between
          # checkout and now doesn't reject the bot's push. Conflicts are very
          # unlikely (the bot only touches content + media); if one happens it
          # fails loudly and the alert issue below opens.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open/update alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Social sync failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            const body = `The hourly social sync run failed.\n\nFailed run: ${runUrl}\n\nCheck the logs — common causes: the Bluesky feed came back empty (broken/renamed handle or API change), a blocked push to \`main\` (branch protection), or a rebase conflict. This issue auto-closes on the next successful run.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close alert issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Social sync failing";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Sync succeeded again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
